<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionTime AI</title><style>body{margin:0;background:#07111f;color:#e9f2ff;font:15px system-ui;padding:32px}main{max-width:1020px;margin:auto}h1{font-size:32px}p{color:#9fb1c9}button{background:#32c48d;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;background:#0e1d31;border-radius:12px;overflow:hidden;margin-top:18px}th,td{padding:13px;text-align:left;border-bottom:1px solid #20324b}th{color:#9fb1c9}.ok{color:#45dc9f}.warn{color:#ffcc66}</style></head><body><main><h1>VisionTime AI</h1><p>Kamera asosidagi kirish-chiqish monitoringi · Bugungi holat</p><button onclick="loadData()">Yangilash</button><table><thead><tr><th>Kamera</th><th>Track ID</th><th>Keldi</th><th>Ketdi</th><th>Davomiylik</th></tr></thead><tbody id="rows"></tbody></table></main><script>function fmt(s){if(s===null)return '<span class="warn">Hali chiqish qayd etilmadi</span>';let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return '<span class="ok">'+h+' soat '+m+' daqiqa</span>'}async function loadData(){let d=await fetch('/api/attendance').then(r=>r.json());document.querySelector('#rows').innerHTML=d.records.map(x=>'<tr><td>'+x.camera_id+'</td><td>'+x.track_id+'</td><td>'+new Date(x.arrived_at).toLocaleTimeString()+'</td><td>'+(x.left_at?new Date(x.left_at).toLocaleTimeString():'—')+'</td><td>'+fmt(x.duration_seconds)+'</td></tr>').join('')||'<tr><td colspan="5">Hozircha hodisa yo‘q. Kamera modulini ishga tushiring.</td></tr>'}loadData();setInterval(loadData,10000)</script></body></html>
